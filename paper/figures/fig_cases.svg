<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="350" viewBox="0 0 1100 350" font-family="Helvetica, Arial, sans-serif"><rect width="1100" height="350" fill="#ffffff"/><text x="550.0" y="30.0" font-size="17" text-anchor="middle" fill="#0f5132" font-weight="bold" font-style="normal">The case split, by the smallest pairwise inner product m = min t_ij</text><rect x="40.0" y="112.0" width="108.0" height="62.0" rx="4" fill="#f6c9a8" stroke="#c2570c" stroke-width="1.2"/><text x="94.0" y="138.0" font-size="15" text-anchor="middle" fill="#12261a" font-weight="bold" font-style="normal">cap</text><text x="94.0" y="159.0" font-size="12.5" text-anchor="middle" fill="#6b7a70" font-weight="normal" font-style="normal">[-1, -0.99]</text><rect x="154.0" y="112.0" width="108.0" height="62.0" rx="4" fill="#bfe6c9" stroke="#0f5132" stroke-width="1.2"/><text x="208.0" y="138.0" font-size="15" text-anchor="middle" fill="#12261a" font-weight="bold" font-style="normal">slab 1</text><text x="208.0" y="159.0" font-size="12.5" text-anchor="middle" fill="#6b7a70" font-weight="normal" font-style="normal">[-0.99, -0.98]</text><rect x="268.0" y="112.0" width="108.0" height="62.0" rx="4" fill="#bfe6c9" stroke="#0f5132" stroke-width="1.2"/><text x="322.0" y="138.0" font-size="15" text-anchor="middle" fill="#12261a" font-weight="bold" font-style="normal">slab 2</text><text x="322.0" y="159.0" font-size="12.5" text-anchor="middle" fill="#6b7a70" font-weight="normal" font-style="normal">[-0.98, -0.96]</text><rect x="382.0" y="112.0" width="108.0" height="62.0" rx="4" fill="#bfe6c9" stroke="#0f5132" stroke-width="1.2"/><text x="436.0" y="138.0" font-size="15" text-anchor="middle" fill="#12261a" font-weight="bold" font-style="normal">slab 3</text><text x="436.0" y="159.0" font-size="12.5" text-anchor="middle" fill="#6b7a70" font-weight="normal" font-style="normal">[-0.96, -0.94]</text><rect x="496.0" y="112.0" width="108.0" height="62.0" rx="4" fill="#bfe6c9" stroke="#0f5132" stroke-width="1.2"/><text x="550.0" y="138.0" font-size="15" text-anchor="middle" fill="#12261a" font-weight="bold" font-style="normal">slab 4</text><text x="550.0" y="159.0" font-size="12.5" text-anchor="middle" fill="#6b7a70" font-weight="normal" font-style="normal">[-0.94, -0.93]</text><rect x="610.0" y="112.0" width="108.0" height="62.0" rx="4" fill="#bfe6c9" stroke="#0f5132" stroke-width="1.2"/><text x="664.0" y="138.0" font-size="15" text-anchor="middle" fill="#12261a" font-weight="bold" font-style="normal">slab 5</text><text x="664.0" y="159.0" font-size="12.5" text-anchor="middle" fill="#6b7a70" font-weight="normal" font-style="normal">[-0.93, -0.90]</text><rect x="724.0" y="112.0" width="336.0" height="62.0" rx="4" fill="#dbeafe" stroke="#1f5fa8" stroke-width="1.2"/><text x="892.0" y="138.0" font-size="15" text-anchor="middle" fill="#12261a" font-weight="bold" font-style="normal">Case 1</text><text x="892.0" y="159.0" font-size="12.5" text-anchor="middle" fill="#6b7a70" font-weight="normal" font-style="normal">m ≥ -0.90</text><text x="40.0" y="98.0" font-size="14" text-anchor="start" fill="#12261a" font-weight="bold" font-style="normal">Case 2:  m &lt; -0.90, pair (0,1) relabelled to be a minimal pair, t01 = m</text><line x1="94.0" y1="174.0" x2="94.0" y2="220.0" stroke="#c2570c" stroke-width="1.5"/><text x="40.0" y="240.0" font-size="13" text-anchor="start" fill="#12261a" font-weight="bold" font-style="normal">Cap. Sharp typed certificate</text><text x="40.0" y="258.0" font-size="13" text-anchor="start" fill="#12261a" font-weight="normal" font-style="normal">(value E(P) − 2.3e-16) forces a</text><text x="40.0" y="276.0" font-size="13" text-anchor="start" fill="#12261a" font-weight="normal" font-style="normal">thin tube; ring rigidity; then</text><text x="40.0" y="294.0" font-size="13" text-anchor="start" fill="#12261a" font-weight="normal" font-style="normal">local minimality (exact 2nd order).</text><text x="40.0" y="312.0" font-size="13" text-anchor="start" fill="#12261a" font-weight="normal" font-style="normal">Gives E ≥ E(P) and uniqueness.</text><line x1="439.0" y1="174.0" x2="439.0" y2="220.0" stroke="#2e9e5b" stroke-width="1.5"/><text x="268.0" y="240.0" font-size="13" text-anchor="start" fill="#12261a" font-weight="bold" font-style="normal">Slabs. Typed three-point certificate per slab,</text><text x="268.0" y="258.0" font-size="13" text-anchor="start" fill="#12261a" font-weight="normal" font-style="normal">pole pair pinned to the slab, all other pairs ≥ lower end.</text><text x="268.0" y="276.0" font-size="13" text-anchor="start" fill="#12261a" font-weight="normal" font-style="normal">Strict margin E > E(P), about 2.6e-6.</text><text x="268.0" y="294.0" font-size="13" text-anchor="start" fill="#12261a" font-weight="normal" font-style="normal">Integer data, Λ = 2^100 each.</text><line x1="892.0" y1="174.0" x2="892.0" y2="220.0" stroke="#1f5fa8" stroke-width="1.5"/><text x="718.0" y="240.0" font-size="13" text-anchor="start" fill="#12261a" font-weight="bold" font-style="normal">Case 1. One untyped three-point</text><text x="718.0" y="258.0" font-size="13" text-anchor="start" fill="#12261a" font-weight="normal" font-style="normal">certificate + degree-10 minorant.</text><text x="718.0" y="276.0" font-size="13" text-anchor="start" fill="#12261a" font-weight="normal" font-style="normal">Strict margin E ≥ E(P) + 3/10000.</text><text x="718.0" y="294.0" font-size="13" text-anchor="start" fill="#12261a" font-weight="normal" font-style="normal">Integer data, Λ = 2^160.</text><text x="550.0" y="336.0" font-size="12.5" text-anchor="middle" fill="#6b7a70" font-weight="normal" font-style="italic">Every piece is closed by exact integer arithmetic checked in the Lean kernel; the cap is the only place where E(P) itself is approached.</text></svg>
