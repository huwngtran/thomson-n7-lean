<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" font-family="Helvetica, Arial, sans-serif"><rect width="1000" height="470" fill="#ffffff"/><text x="500.0" y="28.0" font-size="17" text-anchor="middle" fill="#0f5132" font-weight="bold" font-style="normal">Vertex and pair types used by the typed three-point bound (n = 7)</text><line x1="211.8" y1="356.7" x2="157.3" y2="264.5" stroke="#2e9e5b" stroke-width="3"/><line x1="157.3" y1="264.5" x2="300.0" y2="207.5" stroke="#2e9e5b" stroke-width="3"/><line x1="300.0" y1="207.5" x2="442.7" y2="264.5" stroke="#2e9e5b" stroke-width="3"/><line x1="442.7" y1="264.5" x2="388.2" y2="356.7" stroke="#2e9e5b" stroke-width="3"/><line x1="388.2" y1="356.7" x2="211.8" y2="356.7" stroke="#2e9e5b" stroke-width="3"/><line x1="211.8" y1="356.7" x2="300.0" y2="207.5" stroke="#1f5fa8" stroke-width="1.6" stroke-dasharray="6 4"/><line x1="157.3" y1="264.5" x2="442.7" y2="264.5" stroke="#1f5fa8" stroke-width="1.6" stroke-dasharray="6 4"/><line x1="300.0" y1="207.5" x2="388.2" y2="356.7" stroke="#1f5fa8" stroke-width="1.6" stroke-dasharray="6 4"/><line x1="442.7" y1="264.5" x2="211.8" y2="356.7" stroke="#1f5fa8" stroke-width="1.6" stroke-dasharray="6 4"/><line x1="388.2" y1="356.7" x2="157.3" y2="264.5" stroke="#1f5fa8" stroke-width="1.6" stroke-dasharray="6 4"/><line x1="300.0" y1="85.0" x2="211.8" y2="356.7" stroke="#6b7a70" stroke-width="1"/><line x1="300.0" y1="455.0" x2="211.8" y2="356.7" stroke="#6b7a70" stroke-width="1"/><line x1="300.0" y1="85.0" x2="157.3" y2="264.5" stroke="#6b7a70" stroke-width="1"/><line x1="300.0" y1="455.0" x2="157.3" y2="264.5" stroke="#6b7a70" stroke-width="1"/><line x1="300.0" y1="85.0" x2="300.0" y2="207.5" stroke="#6b7a70" stroke-width="1"/><line x1="300.0" y1="455.0" x2="300.0" y2="207.5" stroke="#6b7a70" stroke-width="1"/><line x1="300.0" y1="85.0" x2="442.7" y2="264.5" stroke="#6b7a70" stroke-width="1"/><line x1="300.0" y1="455.0" x2="442.7" y2="264.5" stroke="#6b7a70" stroke-width="1"/><line x1="300.0" y1="85.0" x2="388.2" y2="356.7" stroke="#6b7a70" stroke-width="1"/><line x1="300.0" y1="455.0" x2="388.2" y2="356.7" stroke="#6b7a70" stroke-width="1"/><line x1="300.0" y1="85.0" x2="300.0" y2="455.0" stroke="#c2570c" stroke-width="3" stroke-dasharray="2 5"/><circle cx="300.0" cy="85.0" r="15" fill="#fde8d7" stroke="#c2570c" stroke-width="2"/><text x="300.0" y="90.0" font-size="14" text-anchor="middle" fill="#12261a" font-weight="bold" font-style="normal">0</text><circle cx="300.0" cy="455.0" r="15" fill="#fde8d7" stroke="#c2570c" stroke-width="2"/><text x="300.0" y="460.0" font-size="14" text-anchor="middle" fill="#12261a" font-weight="bold" font-style="normal">1</text><circle cx="211.8" cy="356.7" r="15" fill="#bfe6c9" stroke="#0f5132" stroke-width="2"/><text x="211.8" y="361.7" font-size="14" text-anchor="middle" fill="#12261a" font-weight="bold" font-style="normal">2</text><circle cx="157.3" cy="264.5" r="15" fill="#bfe6c9" stroke="#0f5132" stroke-width="2"/><text x="157.3" y="269.5" font-size="14" text-anchor="middle" fill="#12261a" font-weight="bold" font-style="normal">3</text><circle cx="300.0" cy="207.5" r="15" fill="#bfe6c9" stroke="#0f5132" stroke-width="2"/><text x="300.0" y="212.5" font-size="14" text-anchor="middle" fill="#12261a" font-weight="bold" font-style="normal">4</text><circle cx="442.7" cy="264.5" r="15" fill="#bfe6c9" stroke="#0f5132" stroke-width="2"/><text x="442.7" y="269.5" font-size="14" text-anchor="middle" fill="#12261a" font-weight="bold" font-style="normal">5</text><circle cx="388.2" cy="356.7" r="15" fill="#bfe6c9" stroke="#0f5132" stroke-width="2"/><text x="388.2" y="361.7" font-size="14" text-anchor="middle" fill="#12261a" font-weight="bold" font-style="normal">6</text><text x="560.0" y="88.0" font-size="14" text-anchor="start" fill="#12261a" font-weight="bold" font-style="normal">Pair type (Gram value at P)</text><line x1="560.0" y1="110.0" x2="604.0" y2="110.0" stroke="#c2570c" stroke-width="3.0" stroke-dasharray="2 5"/><text x="616.0" y="108.0" font-size="13.5" text-anchor="start" fill="#12261a" font-weight="normal" font-style="normal">A: pole–pole (1 pair)</text><text x="616.0" y="125.0" font-size="12.5" text-anchor="start" fill="#6b7a70" font-weight="normal" font-style="normal">t = -1</text><line x1="560.0" y1="150.0" x2="604.0" y2="150.0" stroke="#6b7a70" stroke-width="1.2"/><text x="616.0" y="148.0" font-size="13.5" text-anchor="start" fill="#12261a" font-weight="normal" font-style="normal">B: pole–ring (10 pairs)</text><text x="616.0" y="165.0" font-size="12.5" text-anchor="start" fill="#6b7a70" font-weight="normal" font-style="normal">t = 0</text><line x1="560.0" y1="190.0" x2="604.0" y2="190.0" stroke="#2e9e5b" stroke-width="3.0"/><text x="616.0" y="188.0" font-size="13.5" text-anchor="start" fill="#12261a" font-weight="normal" font-style="normal">C: ring–ring, neighbours (5)</text><text x="616.0" y="205.0" font-size="12.5" text-anchor="start" fill="#6b7a70" font-weight="normal" font-style="normal">t = c1 = (√5-1)/4 ≈ 0.309</text><line x1="560.0" y1="230.0" x2="604.0" y2="230.0" stroke="#1f5fa8" stroke-width="1.6" stroke-dasharray="6 4"/><text x="616.0" y="228.0" font-size="13.5" text-anchor="start" fill="#12261a" font-weight="normal" font-style="normal">C: ring–ring, diagonals (5)</text><text x="616.0" y="245.0" font-size="12.5" text-anchor="start" fill="#6b7a70" font-weight="normal" font-style="normal">t = c2 = -(√5+1)/4 ≈ -0.809</text><text x="560.0" y="320.0" font-size="13" text-anchor="start" fill="#12261a" font-weight="normal" font-style="normal">Vertices 0, 1 are the poles (type P); 2..6 are the ring (type R).</text><text x="560.0" y="341.0" font-size="13" text-anchor="start" fill="#12261a" font-weight="normal" font-style="normal">The certificate has one pair function per type: H_A, H_B, H_C,</text><text x="560.0" y="362.0" font-size="13" text-anchor="start" fill="#12261a" font-weight="normal" font-style="normal">two root kernels S_P, S_R (PSD data), and a slack polynomial</text><text x="560.0" y="383.0" font-size="13" text-anchor="start" fill="#12261a" font-weight="normal" font-style="normal">for each of the three triple types: lamA (P,P,R), lamB (P,R,R),</text><text x="560.0" y="404.0" font-size="13" text-anchor="start" fill="#12261a" font-weight="normal" font-style="normal">lamG (R,R,R). There is no (P,P,P) triple: only two poles.</text><text x="560.0" y="425.0" font-size="13" text-anchor="start" fill="#12261a" font-weight="normal" font-style="normal">C(7,3) = 35 triples = 5 (PPR) + 20 (PRR) + 10 (RRR).</text></svg>
